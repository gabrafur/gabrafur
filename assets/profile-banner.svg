      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(162 84) rotate(42) scale(320 260)">
