<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel B. Furlan — Senior Data and Platform Engineer</title>
  <desc id="desc">Professional banner highlighting data platforms, lakehouse architecture, infrastructure as code, and reliability engineering.</desc>
  <defs>
